[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-query-plan-diff"
version = "0.1.0"
description = "SQLite EXPLAIN QUERY PLAN snapshot capture and regression checker for CI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sqlite-plan-diff = "sqlite_plan_diff.checker:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
